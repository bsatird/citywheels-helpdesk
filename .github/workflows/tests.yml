name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # No API key and no network: the whole suite runs against data/ and a fake model.
      - run: python -m pytest -q
      # The harness itself must work too (fake model, so it needs no key either).
      - run: python eval/run_eval.py --fake --dry-run --quiet
